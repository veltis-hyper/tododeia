<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude de Cero a Cien · Guía interactiva</title>
<style>
{{CSS}}
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="Abrir índice">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4.5h14M2 9h14M2 13.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark">0→100</span>
      <span class="brand-name">Claude de Cero a Cien</span>
    </a>
    <div class="topbar-progress" id="topProgress" title="Progreso total">
      <div class="tp-track"><div class="tp-fill" id="tpFill"></div></div>
      <span class="tp-label" id="tpLabel">0%</span>
    </div>
    <button class="search-btn" id="searchBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Buscar</span>
      <kbd>⌘K</kbd>
    </button>
  </header>

  <div class="layout">

    <nav class="sidebar" id="sidebar" aria-label="Índice de la guía">
      <div class="sidebar-inner" id="sidebarInner"></div>
    </nav>
    <div class="scrim" id="scrim"></div>

    <main class="content" id="content"></main>

    <aside class="pagenav" id="pagenav" aria-label="En este capítulo"></aside>

  </div>
</div>

<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-panel">
    <div class="search-input-row">
      <svg width="16" height="16" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar en toda la guía…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="search-results" id="searchResults"><p class="search-hint">Escribe para buscar en los 25 capítulos, apéndices y glosario.</p></div>
  </div>
</div>

{{TEMPLATES}}

<script type="application/json" id="boveda-data">{{BOVEDA}}</script>

<script>
window.NAV = {{NAV_JSON}};
{{JS}}
</script>
</body>
</html>
